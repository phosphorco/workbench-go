name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.6
          cache: true
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.12
          cache: false
      - name: Acquire the runtime-lock Pkl executable
        run: |
          release/acquire-pkl.sh \
            --lock release/runtime-lock.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/pkl"
      - run: |
          test -n "$PKL_EXECUTABLE"
          case "$PKL_EXECUTABLE" in /*) ;; *) echo "PKL_EXECUTABLE is not absolute: $PKL_EXECUTABLE" >&2; exit 1 ;; esac
          test -x "$PKL_EXECUTABLE"
          go test ./...
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          test -x "$PKL_EXECUTABLE"
          go vet ./...
